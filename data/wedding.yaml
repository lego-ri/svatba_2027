# ============================================================
#  Kačí & Ričí — Svatba 2027 — Hlavní datový soubor
#  Všechny texty a údaje webu se upravují ZDE, nikoli v HTML.
# ============================================================

# ── Základní údaje ───────────────────────────────────────────
couple:
  name_a: "Kačí"
  name_b: "Ričí"
  # Plná jména (pro právní/formální sekce, pokud bude potřeba)
  full_name_a: "Kačí"
  full_name_b: "Ričí"

wedding:
  date: "2027-06-12"          # ISO formát YYYY-MM-DD
  time: "13:00"               # Začátek obřadu
  datetime: "2027-06-12T13:00:00+02:00"   # Pro .ics kalendář (CEST)
  locale: "cs"                # Jazyk webu

# ── Místo konání ─────────────────────────────────────────────
venue:
  name: "Statek P22"
  description: "Vše se koná na jednom místě — obřad, hostina i párty."
  maps:
    google: "https://maps.app.goo.gl/c11qXTEbDV7oo6Tc9"
    mapy_cz: "https://mapy.com/s/fobutovojo"

# ── Parkování ────────────────────────────────────────────────
parking:
  description: "Parkování zdarma, cca 3 minuty chůze od statku."
  maps:
    google: "https://maps.app.goo.gl/zrwLixNxC8QAeks89"
    mapy_cz: "https://mapy.com/s/fukecepupu"

# ── Doprava ──────────────────────────────────────────────────
transport:
  description: "Organizovaná doprava není zajištěna — prosíme, přijeďte autem a zaparkujte na místě uvedeném výše."

# ── Harmonogram dne ──────────────────────────────────────────
# Každá položka: time (HH:MM), title, description (nepovinné), icon (nepovinné)
# Ikony: ceremony, drinks, camera, dinner, cake, dance, party, sparkler
schedule:
  - time: "12:30"
    title: "Příjezd hostů"
    description: "Uvítání a welcome drink."
    icon: "drinks"

  - time: "13:00"
    title: "Svatební obřad"
    description: ""
    icon: "ceremony"

  - time: "14:00"
    title: "Skupinové focení"
    description: "Prosíme o trpělivost, netrvá to dlouho!"
    icon: "camera"

  - time: "14:30"
    title: "Svatební hostina"
    description: ""
    icon: "dinner"

  - time: "17:00"
    title: "Krájení dortu"
    description: ""
    icon: "cake"

  - time: "20:00"
    title: "První tanec"
    description: ""
    icon: "dance"

  - time: "20:30"
    title: "Volná zábava & párty"
    description: "Tancujte do rána!"
    icon: "party"

# ── Ubytování ────────────────────────────────────────────────
accommodation:
  description: "Spaní je ve stanech přímo na zahradě statku. Stany budou připravené na místě — stačí přijet a ubytovat se!"

# ── Dress code ───────────────────────────────────────────────
dress_code:
  style: "Formální"
  description: "Obřad i hostina jsou formální. Budeme moc rádi, pokud svůj oděv sladíte do jemných přírodních tónů."
  terrain_warning: "Obřad se koná na trávníku — dámy, doporučujeme široké podpatky, klínky nebo pohodlnou společenskou obuv."
  palette:
    - name: "Šalvěj"
      hex: "#8E9E7C"
    - name: "Olivová"
      hex: "#56653E"
    - name: "Terakota"
      hex: "#C68369"
    - name: "Písková"
      hex: "#E2D7C5"
    - name: "Kávová"
      hex: "#6B5847"

# ── Barevná paleta webu ──────────────────────────────────────
# Přírodní, botanický styl podle předlohy (olivová, šalvěj, přírodní papír)
colors:
  primary:        "#36402C"   # hluboká lesní/olivová inkoustová (hlavní text a skript)
  secondary:      "#5F6F48"   # teplá šalvějová / olivová zelená (podnadpisy, akcenty)
  sage_light:     "#D5DDC9"   # světlý šalvějový tón (tlačítka, jemné podklady)
  sage_hover:     "#BAC5AC"   # hover stav tlačítek
  background:     "#FAF8F3"   # teplý přírodní papír (slonová kost / bavlněný papír)
  page_backdrop:  "#56653E"   # olivový podklad stránky okolo pozvánky (na širších obrazovkách)
  text:           "#36402C"   # text
  text_muted:     "#6E7A60"   # tlumený text pro doplňující popisky
  border:         "#E2E8D8"   # jemné linky a oddělovače
  border_dark:    "#4A5736"   # tmavší linka pro rámeček odpočtu

# ── Dary ─────────────────────────────────────────────────────
gifts:
  description: "Největším darem je pro nás vaše přítomnost! Pokud nás ale chcete obdarovat, budeme rádi za finanční příspěvek na naše líbánky."
  type: "monetary"     # monetary | registry | none
  # registry_url: ""   # pokud byste přidali registr dárků

# ── Děti & mazlíčci ─────────────────────────────────────────
children:
  allowed: true
  note: "Děti jsou vítány!"

pets:
  allowed_with_consultation: true
  note: "Mazlíčky prosím pouze po předchozí domluvě s námi."

# ── Aby vás nic nepřekvapilo ──────────────────────────────────
# Praktické upozornění pro hosty — přidávejte položky do seznamu.
surprises:
  title: "Aby vás nic nepřekvapilo"
  entries:
    - title: "Obřad je venku"
      description: "Obřad se koná pod širým nebem — v případě deště budeme mít připravené deštníky, nemusíte si nosit vlastní."

    # Sem můžeš přidávat další položky, např.:
    # - title: "Večerní oheň"
    #   description: "Na večer bude připravené ohniště — vezměte si teplejší vrstvu."

# ── Kontakty na den D ────────────────────────────────────────
