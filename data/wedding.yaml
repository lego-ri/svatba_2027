# ── Základní údaje ───────────────────────────────────────────
couple:
  name_a: "Kačí"
  name_b: "Ričí"
  full_name_a: "Kačí"
  full_name_b: "Ričí"

wedding:
  date: "2027-06-12"          # ISO formát YYYY-MM-DD
  time: "13:00"               # Začátek obřadu
  datetime: "2027-06-12T13:00:00+02:00"   # Pro .ics kalendář (CEST)
  locale: "cs"                # Jazyk webu

# ── Místo konání ─────────────────────────────────────────────
venue:
  name: "Statek P22"
  description: "Vše se koná na jednom místě, obřad, hostina i párty."
  maps:
    google: "https://maps.app.goo.gl/c11qXTEbDV7oo6Tc9"
    mapy_cz: "https://mapy.com/s/fobutovojo"

# ── Parkování ────────────────────────────────────────────────
parking:
  description: "Parkování zdarma, cca 3 minuty chůze od statku."
  maps:
    google: "https://maps.app.goo.gl/zrwLixNxC8QAeks89"
    mapy_cz: "https://mapy.com/s/fukecepupu"

# ── Doprava ──────────────────────────────────────────────────
transport:
  description: "Organizovaná doprava není zajištěna — prosíme, přijeďte autem a zaparkujte na místě uvedeném výše."

# ── Harmonogram dne ──────────────────────────────────────────
schedule:
  - time: "12:00–12:30"
    title: "Příjezd hostů"
    description: "Uvítání a welcome drink na dvoře statku"

  - time: "13:00"
    title: "Svatební obřad"
    description: "Řekneme si své ANO pod širým nebem na trávníku"

  - time: "14:30"
    title: "Odpolední raut & oslava"
    description: "Skvělé jídlo, krájení dortu, přípitky a společná zábava"

# ── Ubytování ────────────────────────────────────────────────
accommodation:
  description: "Spaní je ve stanech přímo na zahradě statku. Prosíme, aby si hosté přivezli svůj stan. K dispozici bude také jedno iglú na přespání a jeden velký stan."
  pension_note: "Pokud by někdo potřeboval zařídit ubytování v penzionu, ozvěte se nám — mějte však prosím na paměti, že penzion není v docházkové vzdálenosti."

# ── Dress code ───────────────────────────────────────────────
dress_code:
  description: "Dress code není nijak předepsaný, vezměte si to, v čem se budete cítit dobře a pohodlně. Pokud byste se však chtěli sladit s výzdobou svatby, ponese se v tónech modré a žluté."
  terrain_warning: "Obřad se koná na trávníku — dámy, doporučujeme pohodlnou obuv bez jehlových podpatků (např. klínky nebo širší podpatky)."
  palette:
    - name: "Citronová žlutá"
      hex: "#F5C928"
    - name: "Zlatavá žlutá"
      hex: "#D49A00"
    - name: "Královská modrá"
      hex: "#3B72C5"
    - name: "Hluboká námořnická"
      hex: "#102B50"

# ── Barevná paleta webu ──────────────────────────────────────
colors:
  navy:           "#102B50"
  blue_royal:     "#3B72C5"
  lemon:          "#F5C928"
  lemon_dark:     "#D49A00"
  ivory:          "#FFF8EC"
  leaf_green:     "#556B3A"
  text_dark:      "#102B50"
  text_muted:     "#455870"

# ── Dary ─────────────────────────────────────────────────────
gifts:
  description: "Největším darem je pro nás vaše přítomnost! Pokud nás ale chcete obdarovat, budeme rádi za finanční příspěvek na naše líbánky."
  type: "monetary"

# ── Děti & mazlíčci ─────────────────────────────────────────
pets:
  note: "Své zvířecí mazlíčky nechte prosím doma."

# ── Aby vás nic nepřekvapilo ──────────────────────────────────
surprises:
  title: "Aby vás nic nepřekvapilo"
  entries:
    - title: "Obřad je venku"
      description: "Obřad se koná pod širým nebem — v případě deště budeme mít připravené deštníky, nemusíte si nosit vlastní."
    - title: "Trávník & obuv"
      description: "Areál statku je travnatý, proto dámy ocení širší podpatky nebo společenské klínky."
    - title: "Zvířecí mazlíčci"
      description: "Své čtyřnohé mazlíčky nechte prosím doma."

